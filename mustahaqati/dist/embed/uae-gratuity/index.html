<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حاسبة مكافأة نهاية الخدمة في الإمارات — مستحقاتي</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body class="embed">
<main class="wrap">
  <section class="tool" aria-labelledby="tool-h">
  <h2 id="tool-h">حاسبة مكافأة نهاية الخدمة في الإمارات</h2>
  <form id="calc" novalidate>
    <div class="fields">
      <div class="field">
        <label for="basic">الراتب الأساسي الشهري (درهم)</label>
        <input type="number" id="basic" name="basic" inputmode="decimal" min="0" step="1" value="8000" placeholder="مثال: 8000" required>
        <span class="hint">الأساسي فقط بدون البدلات، كما هو مكتوب في عقد العمل.</span>
      </div>
      <div class="field">
        <label for="start">تاريخ المباشرة</label>
        <input type="date" id="start" name="start" value="2019-03-01" required>
      </div>
      <div class="field">
        <label for="end">آخر يوم عمل</label>
        <input type="date" id="end" name="end" value="2026-11-30" required>
      </div>
      <div class="field">
        <label for="unpaid">أيام الإجازة بدون راتب (اختياري)</label>
        <input type="number" id="unpaid" name="unpaid" inputmode="decimal" min="0" step="1" value="0">
        <span class="hint">تُطرح من مدة الخدمة لأنها لا تُحتسب قانوناً.</span>
      </div>
    </div>
    <div class="actions">
      <button class="btn" type="submit">احسب المكافأة</button>
      <button class="btn secondary" type="button" data-copy="#result">نسخ النتيجة</button>
    </div>
  </form>
  <div id="result" class="result" aria-live="polite"></div>
</section>


  <p class="embed-credit">الحاسبة مقدّمة من <a href="https://mustahaqati.org/uae-gratuity/" target="_blank" rel="noopener">مستحقاتي — حاسبة مكافأة نهاية الخدمة في الإمارات</a></p>
</main>
<script type="module" src="../../assets/app.js"></script>
<script type="module" src="../../assets/pages/uae-gratuity.js"></script>
</body>
</html>
