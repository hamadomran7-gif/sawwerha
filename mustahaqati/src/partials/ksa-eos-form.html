<!--defaults {"heading":"احسب مكافأتك","wage":"9000","start":"2019-01-01","end":"2026-11-30","reason":"contract_end"}-->
<section class="tool" aria-labelledby="tool-h">
  <h2 id="tool-h">{{heading}}</h2>
  <form id="calc" novalidate>
    <div class="fields">
      <div class="field">
        <label for="wage">الأجر الشهري الأخير (ريال)</label>
        <input type="number" id="wage" name="wage" inputmode="decimal" min="0" step="1" value="{{wage}}" required>
        <span class="hint">الأساسي + البدلات الثابتة (السكن، النقل...). هذا هو «الأجر الفعلي» في النظام.</span>
      </div>
      <div class="field">
        <label for="start">تاريخ المباشرة</label>
        <input type="date" id="start" name="start" value="{{start}}" required>
      </div>
      <div class="field">
        <label for="end">آخر يوم عمل</label>
        <input type="date" id="end" name="end" value="{{end}}" required>
      </div>
      <div class="field full">
        <label for="reason">سبب انتهاء العلاقة العمالية</label>
        <select id="reason" name="reason">
          <option value="contract_end"{{reason=contract_end}}>انتهاء مدة العقد أو إنهاؤه من صاحب العمل</option>
          <option value="resignation"{{reason=resignation}}>استقالة من عقد محدد المدة (المادة 79 مكرر)</option>
          <option value="worker_notice"{{reason=worker_notice}}>إنهاء العامل عقداً غير محدد المدة بإشعار (المادة 75)</option>
          <option value="mutual"{{reason=mutual}}>اتفاق الطرفين كتابةً على الإنهاء</option>
          <option value="article_81"{{reason=article_81}}>ترك العمل لإحدى حالات المادة 81 (إخلال صاحب العمل وغيره)</option>
          <option value="resignation_marriage"{{reason=resignation_marriage}}>استقالة العاملة خلال 6 أشهر من الزواج</option>
          <option value="resignation_childbirth"{{reason=resignation_childbirth}}>استقالة العاملة خلال 3 أشهر من الوضع</option>
          <option value="force_majeure"{{reason=force_majeure}}>ترك العمل لقوة قاهرة خارجة عن الإرادة</option>
          <option value="article_80"{{reason=article_80}}>فسخ العقد من صاحب العمل لإحدى حالات المادة 80</option>
          <option value="probation"{{reason=probation}}>إنهاء العقد خلال فترة التجربة</option>
        </select>
      </div>
    </div>
    <div class="actions">
      <button class="btn" type="submit">احسب المكافأة</button>
      <button class="btn secondary" type="button" data-copy="#result">نسخ النتيجة</button>
    </div>
  </form>
  <div id="result" class="result" aria-live="polite"></div>
</section>
