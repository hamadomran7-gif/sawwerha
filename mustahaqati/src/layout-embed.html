<!doctype html>
<html lang="{{lang}}" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="{{root}}assets/style.css">
</head>
<body class="embed">
<main class="wrap">
  {{main}}
  <p class="embed-credit">الحاسبة مقدّمة من <a href="{{parentUrl}}" target="_blank" rel="noopener">{{siteName}} — {{parentTitle}}</a></p>
</main>
<script type="module" src="{{root}}assets/app.js"></script>
{{pageScript}}
</body>
</html>
