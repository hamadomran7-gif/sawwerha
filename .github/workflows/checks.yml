# الفحوص الستة من CLAUDE.md على كل دفع إلى main وكل طلب دمج.
# يتحقق فقط: بلا أسرار ولا نشر، والنشر يبقى من لوحة Cloudflare بعد نجاحها.
# كل فحص يعمل حتى لو فشل ما قبله، فتظهر كل الأعطال في تشغيل واحد.
name: الفحوص

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: اعتماديات اختبارات الوكيل
        run: python -m pip install --quiet pillow requests
      - name: مستحقاتي
        if: ${{ !cancelled() }}
        run: cd mustahaqati && node build.js --check && npm test
      - name: البوت
        if: ${{ !cancelled() }}
        run: cd bot && npm test
      - name: الوكيل
        if: ${{ !cancelled() }}
        run: for f in agent/tests/test_*.py; do python3 "$f" agent || exit 1; done
      - name: صفحات صوّرها
        if: ${{ !cancelled() }}
        run: python3 sitegen/build.py
      - name: امتثالي
        if: ${{ !cancelled() }}
        run: cd emtithali && npm test
      - name: الوساطة
        if: ${{ !cancelled() }}
        run: cd wasit && npm test
      # البناء حتمي، والنشر يجلب الملفات المرفوعة نفسها: أي فرق هنا يعني مخرجات لم تُرفع بعد تعديل مصدرها.
      - name: المخرجات المبنية مطابقة للمرفوع
        if: ${{ !cancelled() }}
        run: git status --porcelain && test -z "$(git status --porcelain)"
